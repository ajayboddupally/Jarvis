name: Jarvis CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          JWT_SECRET: "ci-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaa"
          ADMIN_API_KEY: "ci-admin-key-aaaaaaaa"
          API_KEY_PEPPER: "ci-pepper-aaaaaaaaaaaa"
          DATABASE_URL: "postgresql+asyncpg://jarvis:jarvis@localhost:5432/jarvis"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest -q
